[build]
command = "npm run build"
publish = "dist"
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
[[redirects]]
from = "/api/register"
to = "/.netlify/functions/register"
status = 200
force = true
[[redirects]]
from = "/api/admin-applications"
to = "/.netlify/functions/admin-applications"
status = 200
force = true
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.instagram.com https://www.youtube.com https://www.youtube-nocookie.com; frame-src https://www.instagram.com https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com https://*.cdninstagram.com https://*.fbcdn.net data:; connect-src 'self' https://www.instagram.com https://*.cdninstagram.com https://*.fbcdn.net; upgrade-insecure-requests"
