name: Production smoke checks
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only production checks (never creates registrations)
        env:
          SITE_URL: https://zukaraoke45.netlify.app
        run: node scripts/production-smoke.mjs
